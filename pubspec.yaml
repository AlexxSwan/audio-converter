name: audio_converter
description: Конвертер аудио для Android — MP3, WAV, M4A, FLAC.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  # ffmpeg для Android — основная функциональность конвертации
  ffmpeg_kit_flutter_new: ^1.0.0
  # Выбор файлов через системный диалог
  file_picker: ^6.1.1
  # Доступ к папкам приложения
  path_provider: ^2.1.1
  # Сохранение настроек
  shared_preferences: ^2.2.2
  # Управление разрешениями (storage access)
  permission_handler: ^11.1.0
  # Иконки Material
  cupertino_icons: ^1.0.6
  # Сохранение сконвертированных файлов в галерею
  gal: ^2.1.3
  # Открытие системного файлового менеджера
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis
        run: flutter analyze || true

      # ─── Проверяем, есть ли секреты ─────────────────────────────────────
      - name: Check if keystore secret is set
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "✓ Keystore secret is set — will build release APK"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "✗ Keystore secret is empty — will build debug APK"
          fi

      # ─── Декодирование keystore ────────────────────────────────────────
      - name: Decode keystore from secrets
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "Keystore decoded:"
          ls -lh android/app/upload-keystore.jks
          file android/app/upload-keystore.jks

      - name: Create key.properties
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << PROP
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROP
          echo "key.properties created:"
          cat android/key.properties

      # ─── Сборка APK ─────────────────────────────────────────────────────
      - name: Build release APK (split per ABI, signed)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: flutter build apk --release --no-tree-shake-icons --split-per-abi

      - name: Build debug APK (split per ABI, unsigned fallback)
        if: steps.check_keystore.outputs.has_keystore == 'false'
        run: flutter build apk --debug --no-tree-shake-icons --split-per-abi

      - name: List built APKs
        run: |
          find build -name "*.apk" -exec ls -lh {} \; || true

      # ─── Загрузка артефактов ────────────────────────────────────────────
      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-arm64-v8a
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload arm APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-armeabi-v7a
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload x64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-x86_64
          path: |
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-x86_64-debug.apk
          retention-days: 30
          if-no-files-found: warn

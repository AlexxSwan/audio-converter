name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis
        run: flutter analyze || true

      # ─── Декодирование keystore из GitHub Secrets ──────────────────────
      # Используем secrets.KESTORE_BASE64 напрямую в условии (env в if не работает)
      - name: Decode keystore from secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "Keystore decoded:"
          ls -lh android/app/upload-keystore.jks
          file android/app/upload-keystore.jks

      - name: Create key.properties
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties << PROP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROP
          echo "key.properties created:"
          cat android/key.properties

      # ─── Сборка APK ─────────────────────────────────────────────────────
      # Если keystore есть — release APK (подписан вашим ключом)
      # Если нет — debug APK (fallback)
      - name: Build release APK (split per ABI, signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: flutter build apk --release --no-tree-shake-icons --split-per-abi

      - name: Build debug APK (split per ABI, unsigned fallback)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: flutter build apk --debug --no-tree-shake-icons --split-per-abi

      - name: List built APKs
        run: |
          find build -name "*.apk" -exec ls -lh {} \; || true

      # ─── Загрузка артефактов ────────────────────────────────────────────
      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-arm64-v8a
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload arm APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-armeabi-v7a
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload x64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-x86_64
          path: |
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-x86_64-debug.apk
          retention-days: 30
          if-no-files-found: warn

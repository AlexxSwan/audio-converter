name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Show android/app/build.gradle.kts
        run: |
          echo "=== android/app/build.gradle.kts ==="
          cat android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis (warnings OK)
        run: flutter analyze || true

      # ─── Декодирование keystore из GitHub Secrets ──────────────────────
      # Если секреты не заданы — пропускаем подпись (используется debug fallback)
      - name: Decode keystore from secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "Keystore decoded:"
          ls -lh android/app/upload-keystore.jks

      # Создаём key.properties из секретов
      - name: Create key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << PROP
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROP
          echo "key.properties created:"
          cat android/key.properties

      # ─── Сборка APK ─────────────────────────────────────────────────────
      # Если keystore есть — release APK (подписан, можно обновлять)
      # Если нет — debug APK (подписан debug-ключом, обновлять нельзя)
      - name: Build release APK (split per ABI, signed)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: flutter build apk --release --no-tree-shake-icons --split-per-abi

      - name: Build debug APK (split per ABI, unsigned fallback)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: flutter build apk --debug --no-tree-shake-icons --split-per-abi

      - name: List built APKs
        run: |
          find build -name "*.apk" -exec ls -lh {} \; || true

      # ─── Загрузка артефактов ────────────────────────────────────────────
      # arm64-v8a — для всех современных телефонов (99% устройств, 2020+)
      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-*.apk
          retention-days: 30
          if-no-files-found: warn

      # armeabi-v7a — для старых телефонов (2017-2020)
      - name: Upload arm APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-*.apk
          retention-days: 30
          if-no-files-found: warn

      # x86_64 — для эмуляторов и Chromebook
      - name: Upload x64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-*.apk
          retention-days: 30
          if-no-files-found: warn

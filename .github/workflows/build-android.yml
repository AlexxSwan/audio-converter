name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Show android/app/build.gradle.kts
        run: |
          echo "=== android/app/build.gradle.kts ==="
          cat android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis (warnings OK)
        run: flutter analyze || true

      - name: Build debug APKs (split per ABI for smaller size)
        run: flutter build apk --debug --no-tree-shake-icons --split-per-abi

      - name: List built APKs
        run: |
          find build -name "*.apk" -exec ls -lh {} \; || true

      # arm64-v8a — для всех современных телефонов (99% устройств, 2020+)
      - name: Upload arm64 APK (small, for modern phones)
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 30
          if-no-files-found: warn

      # armeabi-v7a — для старых телефонов (2017-2020)
      - name: Upload arm APK (for older phones)
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          retention-days: 30
          if-no-files-found: warn

      # x86_64 — для эмуляторов и Chromebook
      - name: Upload x64 APK (for emulators)
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-debug.apk
          retention-days: 30
          if-no-files-found: warn

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      # Если в репозитории нет полной Android-структуры (build.gradle, settings.gradle,
      # MainActivity.kt и т.д.) — сгенерируем её автоматически.
      - name: Generate Android project files
        run: flutter create . --project-name audio_converter --platforms android --org com.example

      # ВАЖНО: повышаем compileSdkVersion до 35, чтобы избежать ошибок плагинов
      - name: Patch Android build.gradle for SDK 35
        run: |
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
          echo "=== Patched build.gradle ==="
          cat android/app/build.gradle || cat android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis (warnings OK)
        run: flutter analyze || true

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: List built APK
        run: |
          ls -lh build/app/outputs/flutter-apk/ || true
          find build -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn
